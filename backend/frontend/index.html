<!DOCTYPE html>
<html>
<head>
  <title>Team Task Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .box {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h3 {
      margin-bottom: 10px;
      color: #444;
    }

    input {
      width: 65%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }
  </style>
</head>

<body>

<h1>Team Task Manager</h1>

<div class="container">

  <div class="box">
    <h3>Create User</h3>
    <input id="name" placeholder="Name"><br>
    <input id="email" placeholder="Email"><br>
    <button onclick="createUser()">Create User</button>
  </div>

  <div class="box">
    <h3>Create Project</h3>
    <input id="projectName" placeholder="Project Name"><br>
    <button onclick="createProject()">Create Project</button>
  </div>

  <div class="box">
    <h3>Create Task</h3>
    <input id="taskTitle" placeholder="Task Title"><br>
    <button onclick="createTask()">Create Task</button>
  </div>

</div>

<script>
  const BASE_URL = "https://team-task-manager-production-842e.up.railway.app"; // change after deploy

  async function createUser() {
    await fetch(BASE_URL + "/users", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: "123",
        role: "ADMIN"
      })
    });
    alert("User Created");
  }

  async function createProject() {
    await fetch(BASE_URL + "/projects", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        name: document.getElementById("projectName").value,
        createdBy: 1
      })
    });
    alert("Project Created");
  }

  async function createTask() {
    await fetch(BASE_URL + "/tasks", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        title: document.getElementById("taskTitle").value,
        status: "PENDING",
        assignedTo: 1,
        projectId: 1,
        deadline: "2026-05-10"
      })
    });
    alert("Task Created");
  }
</script>

</body>
</html>
